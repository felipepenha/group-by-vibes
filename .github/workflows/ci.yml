name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dev dependencies
        run: uv sync --locked --group dev

      - name: Run ruff check
        run: uv run --no-sync ruff check src/ tests/ examples/ .agents/skills/sync-examples/scripts/

  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dev dependencies
        run: uv sync --locked --group dev

      - name: Run mypy
        run: uv run --no-sync mypy src/group_by_vibes/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: uv sync --locked --group dev

      - name: Run pytest with coverage
        run: uv run --no-sync pytest -v --cov=group_by_vibes --cov-branch

      - name: Run core-only benchmark scoring smoke test
        run: uv run --no-sync python examples/bird_eval.py score --input examples/fixtures/bird_sample.jsonl > /dev/null

      - name: Verify example reports stay in sync
        run: uv run --no-sync python .agents/skills/sync-examples/scripts/sync_examples.py verify

  build:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build

      - name: Verify built wheel installs cleanly
        run: |
          uv run --isolated --no-project --with dist/*.whl python -c "
          import group_by_vibes as gbv
          assert gbv.__version__
          res = gbv.compute_valid_sql_rate(['SELECT id FROM u'], [{'u': ['id']}], dialect='postgres')
          assert res['valid_sql_rate'] == 1.0
          "
