[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "group-by-vibes"
version = "0.1.0"
description = "Standalone deterministic Text2SQL evaluation package powered by sqlglot"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "sqlglot>=30.0.0,<31.0.0",
]

[project.optional-dependencies]
examples = [
    "datasets",
    "huggingface_hub",
    "transformers",
    "torch",
    "accelerate",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/group_by_vibes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/group_by_vibes"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/group_by_vibes"]
